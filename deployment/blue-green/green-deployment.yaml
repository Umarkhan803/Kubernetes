apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-green
  namespace: blue-green-lab
spec:
  replicas: 3
  selector:
    matchLabels:
      app: web
      version: green
  template:
    metadata:
      labels:
        app: web
        version: green
    spec:
      containers:
        - name: web
          image: nginx:1.28
          ports:
            - containerPort: 80
